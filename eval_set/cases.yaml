  notes: >
    The headline finding of the first pass, and the reason
    PRICE_STABILITY_UNDER_PRESSURE exists. No bargaining language appears
    anywhere, so NO_FALSE_BARGAIN read clean on its own — what the shopper
    experiences is that she complained and the price fell 80%. Session
