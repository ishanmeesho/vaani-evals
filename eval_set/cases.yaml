# ═══ FACTUALITY / SELF-CONSISTENCY ══════════════════════════════════

- id: fact-001-invented-delivery-window
  session_id: 8da34846-9aec-4995-bd9f-0e4f92ce8a50
  priority: critical
  difficulty: easy
  tags: [factuality, policy, delivery, systemic]
  state:
    screen: MAIN
    established: []
  turns:
    - "aap 6-7 ki jaldi lag rahi ho kya"
  expected:
    reply_omits: ["5 से 7 दिन", "दिन में सामान पहुँच"]
    dimensions:
      FACTUALITY: fail
      NO_UNSOLICITED_POLICY: fail
      ACT_NOT_ASK: fail
      NO_DROPPED_ASK: fail
    rubric: >
      PASS if no delivery window is stated, or one is quoted from order data.
      FAIL if a window is produced from priors. Nothing in context on a home
      screen with no order supplies a delivery estimate.
  vaani_said: "हाँ, अक्सर 5 से 7 दिन में सामान पहुँच जाता है, लेकिन आपके लिए सही समय “Delivering to Bhind-477001” के पास/ऑर्डर के बाद दिखता है।"
  notes: >
    Priority critical because it is systemic, not incidental: the identical
    "5 से 7 दिन" appears in session fff72879 too, on a completely different
    product. It is a memorised phrase, so a prompt fix should move both.

