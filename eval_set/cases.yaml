  turns:
    - "chhah aur sath mein bataiye"
  expected:
    calls_action: [SEARCH]
    search_query_includes: ["girls shoes", "200", "size 7"]
    dimensions:
      ATTRIBUTE_CARRYOVER: pass
      QUERY_QUALITY: pass
      SEARCH_TRIGGER: pass
    rubric: >
      PASS if product type, price bound and the new size all survive into one
      query. FAIL if any is dropped.
  search_fired: "girls shoes under 200 size 7"
  notes: >
    The should-serve counterpart for carryover: this is correct behaviour from
