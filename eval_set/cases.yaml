# Vaani golden eval set — v2
#
# Authored to the case shape in the commerce-agents `commerce-evals` skill,
# adapted where Vaani's domain differs from a tool-calling shopping agent
# (see `shape` below and the divergence note at the bottom of rubric.yaml).
#
# Every case is a REAL production conversation from the 2026-08-26 1% sample,
# hand-adjudicated. Nothing here is synthetic. `session_id` lets any case be
# re-pulled in full from gold.va_user_session_activity.
#
# Two uses:
#   1. Regression. Replay `turns` against a candidate prompt or config in
#      vaani-lab and assert `expected`. This is the fixed surface to diff when
#      something changes — the daily production sample is a different 1% of a
#      different day and cannot be diffed case by case.
#   2. Judge calibration. Feed the transcript with the verdicts hidden and
#      measure agreement. Below `calibration.min_agreement` means the judge
#      drifted, not that Vaani changed. Check this BEFORE believing a movement
#      in the daily score.

shape:
  id: "<flow>-<nnn>-<behavior>"
  priority: "critical | high | medium | low — which failures matter in a report"
  difficulty: "easy | medium | hard — how hard the case is to score correctly"
  skip: "present only when the case cannot run yet, with the reason"
  state: >
    The precondition the runner loads before the turn: the screen, the products
    already seen, and `established` — the constraints the shopper has already
    stated, which is Vaani's equivalent of injected session state. Earlier
    `turns` are for state the behaviour itself carries, and nothing else.
  turns: "the shopper's utterances, in order, as ASR produced them"
  expected: >
    Only the keys the case is about. Code graders first — `calls_action`,
    `never_calls`, `max_searches`, `search_query_includes`,
    `search_query_omits`, `search_query_max_tokens`, `no_question`,
    `reply_includes`, `reply_omits` — then `dimensions` (the adjudicated
    verdict per rubric dimension) and `rubric` (the one PASS/FAIL condition a
    judge decides).
  notes: "what the case pins, and the fact in the data that decides it"

cases:

# ═══ SEARCH: fires when it should ═══════════════════════════════════

- id: search-001-complete-request-not-searched
  session_id: a0c7ffac-51d9-453f-9547-04dd4435c835
  priority: critical
  difficulty: hard
  tags: [search, ask-back, first-turn]
  state:
    screen: CATALOG_SEARCH_RESULTS
    established: []
  turns:
    - "kya aap mujhe Chhote handbag dikha sakti hain Kyunki Main Badi Nahin hun"
  expected:
    calls_action: [SEARCH]
    no_question: true
    reply_omits: ["किस रंग", "बजट कितन"]
    dimensions:
      SEARCH_TRIGGER: fail
      ACT_NOT_ASK: fail
      NO_MANUAL_DEFLECTION: pass
      PERSONA: pass
      LANGUAGE_DISCIPLINE: pass
      RESPONSE_LENGTH: pass
    rubric: >
      PASS if a search fires on this turn and the reply asks nothing. FAIL if
      no search fires, or the reply asks for colour, budget, size, gender or
      age. "chhote handbag dikha sakti hain" is a complete request.
  vaani_said: "जी हाँ, आप छोटे handbag देखना चाहती हैं—इस पेज पर ऊपर “handbags” कैटेगरी में छोटे साइज वाले बैग दिख रहे हैं। आप किस रंग का छोटा handbag चाहेंगी, और आपका बजट कितने रुपये तक है?"
  notes: >
    The single most valuable case in the set, and the reason `difficulty: hard`.
    It is warm, correct Devanagari, screen-grounded, and it fails two blockers:
    two forbidden attribute questions before any search, on a request that
    needed none. A judge that passes this is mis-calibrated. A config change
    that leaves it unchanged has not touched the product's main problem.

- id: search-002-product-switch-ignored
