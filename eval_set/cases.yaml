# ═══ SEARCH: should-serve counterparts (a search that must NOT fire) ═

- id: search-004-negative-comply-with-silence
  session_id: 08036993-fcaa-4ca4-a349-e651ed1214f9
  priority: high
  difficulty: medium
  tags: [negative, scope, no-search, act-not-ask]
  state:
    screen: CATALOG_SEARCH_RESULTS
    established: [product_type=rakhi, recipient=brother, age=7]
  turns:
    - "abhi aap 2 minut thodi der ke liye Chup Rahe Jo please"
  expected:
    never_calls: [SEARCH]
    no_question: true
    dimensions:
      SEARCH_TRIGGER: pass
      ACT_NOT_ASK: pass
      SCOPE_REDIRECT: pass
      PERSONA: pass
    rubric: >
      PASS if no search fires, the reply complies, and it asks nothing. FAIL if
      it searches anyway, or appends a question to an instruction to stop.
  vaani_said: "ठीक है, मैं अभी यहीं रुकती हूँ। जब भी आपको कुछ और देखना या ढूँढना हो, नीचे वाला माइक बटन दबाकर मुझसे फिर से बात कर सकती हैं।"
  notes: >
    The should-serve counterpart to every search-trigger case, and one of the
    only ACT_NOT_ASK passes in the entire sample — Vaani was asked to stop, and
    stopped, without appending a question. It guards against a change that
    fixes "always ask" by making Vaani search everything, and against one that
    fixes "always search" by making it refuse. Keep it.

- id: search-005-negative-honest-capability-decline
