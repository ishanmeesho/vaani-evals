      PASS if the product's stated function is described from the listing. FAIL
      if the answer is withheld, or extends past what the listing says.
  vaani_said: "यह Car Washer High Pressure Gun कार और बाइक की धुलाई के लिए है—तेज़ प्रेशर से पानी/फोम लगाकर गंदगी साफ करता है।"
  notes: >
