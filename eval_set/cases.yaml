    seen_products: ["Pokemon playing card packs"]
    established: [product_type=playing cards]
  turns:
    - "Mandir"
  expected:
    calls_action: [SEARCH]
    search_query_includes: ["mandir"]
    dimensions:
      SEARCH_TRIGGER: fail
      PRODUCT_REFERENT: fail
      NO_DROPPED_ASK: fail
      PERSONA: fail
      ACT_NOT_ASK: fail
    rubric: >
      PASS if a search fires for a mandir. FAIL if the reply is about the
      playing cards still on screen. A bare product noun is a new sscat and a
      complete request; the previous category is irrelevant to it.
  vaani_said: "आप “पोकेमॉन प्लेइंग कार्ड” दिख रहे हैं, असली ट्रेडिंग कार्ड/ग्लास वाली बात इस लिस्ट में साफ़ नहीं दिख रही। नीचे जो फोटो में कार्डों का पैक/डेक दिख रहा है, उसमें “Pokemon playing card” वाले ऑप्शन में से कौन सा चाहिए—कम दाम वाला या 100PCS/55PCS वाला?"
  notes: "Also fails PERSONA on 'इस लिस्ट में साफ़ नहीं दिख रही' — narrating what it could not find."

- id: search-003-variant-request-not-searched
  session_id: cd603840-65a8-438c-b867-be72e13aba90
  priority: high
  difficulty: medium
  tags: [search, similar-products, colour-variant]
  state:
    screen: SINGLE_PRODUCT
    seen_products: ["5 MTR crepe printed fabric"]
    established: [product_type=kurti fabric, length=5m]
  turns:
    - "Kya Mujhe Aise kapde Mein Neelam Si Nahin Mil sakti"
  expected:
    calls_action: [SEARCH]
    search_query_includes: ["blue", "fabric"]
    dimensions:
      SEARCH_TRIGGER: fail
      SELF_CONSISTENCY: fail
    rubric: >
      PASS if a search fires for the fabric in a blue shade. FAIL if the reply
      only points at on-screen colour swatches, or asserts the shade is
