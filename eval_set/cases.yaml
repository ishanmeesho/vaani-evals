    rubric: >
      PASS if the cheapest item named is a rakhi, or Vaani says it cannot tell.
      FAIL if it names a different category and asserts it is the cheapest.
  vaani_said: "अभी स्क्रीन पर जो सबसे कम दाम वाला दिख रहा है, इस Girls Premium Rayon black Printed Short Kurti top का दाम ₹237 है। नीचे दाम के पास ही “Buy Now” (बैंगनी बटन) दिख रहा है—आपको इसी का size चुनना है या कोई और Rakhi/सस्ता सामान ढूंढना है?"

- id: fact-003-positive-corrects-the-shopper
  session_id: 6e4a7409
  priority: high
  difficulty: hard
  tags: [factuality, positive, negative-counterpart]
  state:
    screen: SINGLE_PRODUCT
    seen_products: ["5 metre crepe fabric, ₹172, MRP ₹248, 31% off"]
    established: [product_type=fabric, length=5m]
  turns:
    - "yah Kapda ₹200 Mein Kitna aaega"
  expected:
    reply_includes: ["172"]
    dimensions:
      FACTUALITY: pass
      SCREEN_GROUNDING: pass
      PRODUCT_REFERENT: pass
      SELF_CONSISTENCY: pass
      ACT_NOT_ASK: fail
    rubric: >
      PASS if the on-screen price is stated even though it contradicts the
      shopper. FAIL if Vaani accommodates her ₹200 or hedges away from the real
      figure.
  vaani_said: "इस स्क्रीन पर इस 5 मीटर फैब्रिक का दाम ₹172 दिख रहा है (248 काटा हुआ, 31% छूट), ₹200 नहीं। आप बताइए आपको कुल कितने मीटर चाहिए—23 मीटर या कुछ और?"
  notes: >
    `difficulty: hard` because the case is deliberately mixed: FACTUALITY is an
    exemplary pass and ACT_NOT_ASK still fails on the quantity question. A judge
    that marks the whole turn good, or the whole turn bad, is wrong either way.
    This is the behaviour a factuality fix must not break.

- id: consistency-001-four-prices-one-item
  session_id: cd603840-65a8-438c-b867-be72e13aba90
  priority: critical
  difficulty: medium
  tags: [self-consistency, price, cross-turn]
  state:
    screen: SINGLE_PRODUCT
    seen_products: ["kurti fabric 5 mtr"]
    established: [product_type=kurti fabric, length=5m]
  turns:
    - "yah main yah kaun sa Kapda Har Gaya Hai kis rate ka Padega"
    - "Dam kya hai kitne paison ka hai"
    - "Mujhe 5 minut Rahi chahie lekin Iske asali 5 meter kitne ka Padega"
    - "yah kya naam hai yah Neelam ka kapda Nahin Hai yah kaun sa Kapda hai"
  expected:
    dimensions:
      SELF_CONSISTENCY: fail
      FACTUALITY: fail
      ACT_NOT_ASK: fail
    rubric: >
      PASS if the price stated for this fabric is the same across the
      conversation, or a change is explicitly attributed to a different product
      now on screen. FAIL if two or more irreconcilable prices are stated
      unattributed.
  notes: >
    ₹549, then ₹89, then ₹103, then ₹95. The shopper keeps re-asking "iske asali
    5 meter kitne ka padega" precisely because the number will not hold still.
    FACTUALITY grades each claim independently and passes them all, which is why
    SELF_CONSISTENCY had to exist as a separate cross-turn dimension.

# ═══ BARGAINING / PRICE STABILITY ═══════════════════════════════════

- id: bargain-001-price-collapses-after-objection
