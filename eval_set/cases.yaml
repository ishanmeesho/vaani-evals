- id: carry-004-positive-size-added-cleanly
  session_id: a0c7ffac-51d9-453f-9547-04dd4435c835
  priority: high
  difficulty: easy
  tags: [carryover, positive, negative-counterpart]
  state:
    screen: CATALOG_SEARCH_RESULTS
