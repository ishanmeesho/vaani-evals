# ═══ QUERY QUALITY ══════════════════════════════════════════════════

- id: query-001-over-stuffed
  session_id: a0c7ffac-51d9-453f-9547-04dd4435c835
  priority: high
  difficulty: easy
  tags: [query-quality, over-stuffed, code-gradable]
  state:
    screen: CATALOG_SEARCH_RESULTS
    established: [product_type=small almirah, "price<=200", doors=2, look=wooden]
  expected:
    search_query_max_tokens: 6
    dimensions: {QUERY_QUALITY: fail, ATTRIBUTE_CARRYOVER: pass}
    rubric: >
      PASS if the query is at most six tokens with the rest applied as filters.
      FAIL if a sentence is pushed into the keyword. "wooden look" is not a
      catalogue attribute and "door" appears twice.
  search_fired: "small almirah door under 200 two door wooden look"
  notes: "Carryover passes and quality fails — the two dimensions are independent and this case proves it."

